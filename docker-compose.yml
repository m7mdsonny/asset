# GACMS - Group Asset Custody Management System
# Usage: copy .env.example to .env, set SECRET_KEY and DATABASE_URL, then:
#   docker-compose up -d
# Migrations run automatically on startup via entrypoint.

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: gacms
      POSTGRES_PASSWORD: gacms_secret
      POSTGRES_DB: gacms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gacms"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gacms:gacms_secret@db:5432/gacms
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-characters-required}
      SCAN_BASE_URL: ${SCAN_BASE_URL:-http://localhost:8000}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./generated_pdfs:/app/generated_pdfs
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Running migrations..."
        alembic upgrade head
        echo "Starting server..."
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
